<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Makes the page fit phone screens instead of showing a tiny desktop page -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiet room</title>
  <meta name="description" content="A quiet place to read, study, or work alongside friends. No notifications, no games, no distractions.">

  <!-- Asks search engines not to list this page, since the room is shared by link -->
  <meta name="robots" content="noindex">

  <!-- What shows when the link is shared in a message -->
  <meta property="og:title" content="Quiet room">
  <meta property="og:description" content="A quiet place to read, study, or work alongside friends. No notifications, no games, no distractions.">
  <meta property="og:type" content="website">

  <!-- Font from Google Fonts: Libre Baskerville, Regular and Italic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap">

  <!-- The room's own look: Moon jar colors, fonts, spacing -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- The main part of the page. Edit the words here. -->
  <main>
    <h1>Quiet room</h1>
    <p class="intro">A quiet place to read, study, or work alongside friends. No notifications, no games, no distractions.</p>

    <!-- This line is replaced by the room once joining works (step 5) -->
    <p class="note">The room opens soon.</p>
  </main>

  <!-- Small link back to the website -->
  <footer>
    <p><a href="https://danielyoonwrites.github.io">Made by Daniel Yoon</a></p>
  </footer>

</body>
</html>
