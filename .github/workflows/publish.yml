# TEMPORARY test version on Claude's branch only. Not for merging.
name: Publish site
on:
  workflow_dispatch:
jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the live guide
        run: |
          for f in "" style.css guide.js; do
            echo "=== /fewer-spam-calls/$f"
            curl -sS -D - -o /tmp/out "https://danielyoonwrites.github.io/fewer-spam-calls/$f" | grep -iE "^HTTP|cache-control|last-modified|age:" || true
            wc -c < /tmp/out
          done
          echo "=== live style.css has the one-screen-at-a-time rules?"
          curl -sS "https://danielyoonwrites.github.io/fewer-spam-calls/style.css" | grep -c "js .screen" || true
