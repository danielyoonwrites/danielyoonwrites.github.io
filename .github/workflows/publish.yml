# Publishes the website with GitHub Pages.
# Runs when a change is merged into main, and whenever you click "Run workflow" in the Actions tab.

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publish at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the website files
        uses: actions/checkout@v4

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
